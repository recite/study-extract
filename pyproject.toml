[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "study-extract"
version = "0.1.0"
description = "Extract study records with field-level evidence and evaluate them against reviewed references."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Gaurav Sood"}]
keywords = ["evidence", "systematic-review", "social-science", "extraction", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["pydantic>=2.10,<3", "pypdf>=6,<7", "fonttools>=4.63,<5", "PyYAML>=6,<7"]

[project.urls]
Source = "https://github.com/recite/study-extract"
Issues = "https://github.com/recite/study-extract/issues"
Documentation = "https://github.com/recite/study-extract/blob/main/README.md"

[project.scripts]
study-extract = "study_extract.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15", "build>=1", "hatchling", "editables", "jsonschema>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/study_extract"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
